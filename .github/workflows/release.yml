name: Publish Windows release
on:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: write
# Two pushes must not both decide to publish the same version.
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    # Main publishes a strictly newer stable version; an explicit marker
    # permits a deliberate release from a reviewed branch. Tags still work.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/') && contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'package.json must contain a stable version.' }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must equal v plus the version in package.json.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or !$latest) { throw 'Cannot determine latest published release; refusing to publish.' }
          $publish = node scripts/should-release.js $version $latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare stable release versions.' }
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Current version: $version; latest release: $latest; publish: $publish"
          if ($publish -eq 'true' -and $env:GITHUB_REF -notlike 'refs/tags/*') {
            $refsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v$version"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing tags.' }
            $refs = @($refsJson | ConvertFrom-Json)
            if ($refs | Where-Object { $_.ref -eq "refs/tags/v$version" }) { throw "Tag v$version already exists; refuse to publish from a different commit." }
          }
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - if: steps.plan.outputs.publish == 'true'
        run: npm test
      - name: Test native menu
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/test-native-menu.ps1
      - if: steps.plan.outputs.publish == 'true'
        run: npm run dist:win
      - if: steps.plan.outputs.publish == 'true'
        run: node scripts/verify-update.js
      - name: Publish GitHub Release
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release create $tag dist/setup.exe dist/latest.yml --target $env:GITHUB_SHA --latest --title "Net Control $tag" --notes "Windows x64 installer and auto-update metadata. The installer is unsigned."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify published assets and latest release
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v' + (node -p "require('./package.json').version")
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest -ne $tag) { throw 'The published release is not the latest stable release.' }
          gh release download $tag --pattern setup.exe --pattern latest.yml --dir published
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download published release assets.' }
          foreach ($name in @('setup.exe', 'latest.yml')) {
            if ((Get-FileHash "dist/$name" -Algorithm SHA256).Hash -ne (Get-FileHash "published/$name" -Algorithm SHA256).Hash) { throw "Published $name differs from the verified build." }
          }
          Write-Output "Published assets match the verified $tag build."
