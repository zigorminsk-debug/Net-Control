name: Publish Windows release
on:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # Ordinary branch pushes never publish. An explicit marker permits a release
    # from the current reviewed branch; tags still support the normal process.
    if: startsWith(github.ref, 'refs/tags/v') || (startsWith(github.ref, 'refs/heads/') && contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'package.json must contain a stable version.' }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must equal v plus the version in package.json.' }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - run: node scripts/verify-update.js
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release create $tag dist/setup.exe dist/latest.yml --target $env:GITHUB_SHA --title "Net Control $tag" --notes "Windows x64 installer and auto-update metadata. The installer is unsigned."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
