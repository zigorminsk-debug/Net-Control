name: Verify published updater
on:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  updater-smoke:
    if: contains(github.event.head_commit.message, '[verify-update]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - run: node scripts/verify-update.js
      - name: Check and download using the Electron updater
        shell: pwsh
        env:
          SMOKE_PREVIOUS_VERSION: '1.4.0'
        run: |
          $process = $null
          try {
            $process = Start-Process -FilePath (Resolve-Path 'node_modules/electron/dist/electron.exe') -ArgumentList (Resolve-Path 'scripts/smoke-update.js') -Wait -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          } catch {
            Write-Output "::error::Failed to launch smoke test: $($_.Exception.Message)"
            exit 1
          }
          foreach ($file in @('smoke-out.txt', 'smoke-err.txt')) {
            if (Test-Path $file) {
              foreach ($line in Get-Content $file) {
                $safe = ($line -replace 'https?://\S+', '[url]').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                if ($safe.Length -gt 1000) { $safe = $safe.Substring(0, 1000) }
                if ($safe.Trim()) { Write-Output "::notice::$safe" }
              }
            }
          }
          if ($process.ExitCode -ne 0) { Write-Output "::error::Electron updater smoke test failed: $($process.ExitCode)"; exit 1 }
