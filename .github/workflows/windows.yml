name: Windows installer
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        id: build
        shell: cmd
        continue-on-error: true
        run: npm run dist:win > build-output.txt 2>&1
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $lines = Get-Content build-output.txt | Where-Object { $_.Trim().Length -gt 0 }
          foreach ($line in $lines) {
            $line = $line.Trim()
            if ($line.Length -gt 1500) { $line = $line.Substring(0, 1500) }
            $line = $line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$line"
          }
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Net-Control-Windows
          path: dist/setup.exe
          if-no-files-found: error
          retention-days: 30
