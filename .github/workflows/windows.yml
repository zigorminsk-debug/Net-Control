name: Windows installer
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        shell: pwsh
        run: |
          cmd /c "npm run dist:win > build-output.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content build-output.txt
          if ($code -ne 0) {
            $lines = Get-Content build-output.txt | Where-Object { $_.Trim().Length -gt 0 }
            $tail = (($lines | Select-String -Pattern 'error|failed|cannot|exit|exception' -Context 2,4 | Out-String).Trim()).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$tail"
            exit $code
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Net-Control-Windows
          path: dist/setup.exe
          if-no-files-found: error
          retention-days: 30
